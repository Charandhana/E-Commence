{% extends 'store/base.html' %}

{% block title %}Create Account — ShopEase{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            Shop<span>Ease</span>
        </div>

        <span class="section-label">
            GET STARTED
        </span>

        <h1>Create your account</h1>

        <p class="auth-subtitle">
            Join ShopEase and start shopping today.
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input type="text"
                       name="username"
                       placeholder="Choose a username"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email"
                       name="email"
                       placeholder="you@example.com">

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input type="password"
                       name="password"
                       placeholder="Create a password"
                       required>

            </div>


            <div class="form-group">

                <label>
                    Confirm Password
                </label>

                <input type="password"
                       name="password2"
                       placeholder="Confirm password"
                       required>

            </div>


            <button type="submit"
                    class="auth-submit">

                Create Account

            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
